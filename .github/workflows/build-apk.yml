name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # gradle-wrapper.jar is a binary, so we fetch the official wrapper files
      - name: Fetch Gradle wrapper
        run: |
          cd android
          curl -sSLO https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradlew
          chmod +x gradlew
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskpet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
