name: Build APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # gradle-wrapper.jar is a binary, so we fetch the official wrapper files
      - name: Fetch Gradle wrapper
        run: |
          cd android
          curl -sSLO https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradlew
          chmod +x gradlew
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secrets found. Building with the debug key (fine for your own phone, rejected by Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      # The run number becomes the Android versionCode, so every build is
      # higher than the last (Play rejects uploads that reuse a versionCode).
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: taskpet-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
