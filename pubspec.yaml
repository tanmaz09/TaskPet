name: taskpet
description: A gamified daily task app — complete tasks to evolve your creature.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.2
  confetti: ^0.7.0
  path_provider: ^2.1.2
  share_plus: ">=10.0.0"
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
